name: Template CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-test:
    name: Generate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: '1.12.4.1607'
          bb: '1.12.215'
          clj-kondo: '2026.01.19'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: clj-${{ runner.os }}-${{ hashFiles('resources/**/deps.edn', '.github/workflows/ci.yml') }}
          restore-keys: |
            clj-${{ runner.os }}-

      - name: Install deps-new
        run: clojure -Ttools install-latest :lib io.github.seancorfield/deps-new :as new

      - name: Generate a workspace from the template
        run: |
          cd "$RUNNER_TEMP"
          clojure -Sdeps "{:deps {io.github.brianium/polyllmith {:local/root \"$GITHUB_WORKSPACE\"}}}" \
            -Tnew create :template brianium/polyllmith :name acme/genapp

      - name: Check substitution completeness
        run: |
          cd "$RUNNER_TEMP/genapp"
          # No unsubstituted mustache tags may remain, except the two deliberate
          # raw payloads: the generated CI workflow (GitHub Actions expressions) and the
          # discuss skill (literal {{brief}}/{{question}} placeholders).
          leftovers="$(grep -rn '{{' . --exclude-dir=.git \
            | grep -v '\.github/workflows/ci\.yml:' \
            | grep -v '\.claude/skills/discuss/' || true)"
          if [ -n "$leftovers" ]; then
            echo "❌ Unsubstituted template tags found:"
            echo "$leftovers"
            exit 1
          fi
          if grep -rq polyllmith . --exclude-dir=.git; then
            echo "❌ Literal 'polyllmith' leaked into the generated workspace"
            exit 1
          fi

      - name: Lint generated workspace
        run: |
          cd "$RUNNER_TEMP/genapp"
          bb kondo:lint

      - name: Test generated workspace
        run: |
          cd "$RUNNER_TEMP/genapp"
          bb test
